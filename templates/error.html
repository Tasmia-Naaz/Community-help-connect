{% extends "base.html" %}

{% block title %}{{ error_code }} - {{ title }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm border-0 p-4 p-md-5 rounded-4">
                <div class="display-1 fw-bold text-danger mb-2">{{ error_code }}</div>
                <h3 class="fw-bold text-dark mb-3">{{ title }}</h3>
                <p class="text-secondary mb-4">
                    {{ message }}
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                        <i class="bi bi-arrow-left me-1"></i> Go Back
                    </a>
                    <a href="{{ url_for('index') }}" class="btn btn-primary px-3">
                        <i class="bi bi-house-door me-1"></i> Home Page
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
